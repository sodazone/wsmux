log_level: info

# Websocket connection per IP rate limit
rate_limit:
  enabled: false
  window: 1m
  max_requests: 100
  # Trusted networks for forwarding/proxy headers
  trusted_networks:
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 127.0.0.1/32

# Upstream servers
upstream:
  debug:
    stats:
      enabled: false
      interval: 30s
  # A method is stateless if
  # (1) its result does not depend on the node’s current chain tip or state, and
  # (2) it can be served equivalently from any node, at any time, without breaking logical consistency.
  stateless:
    [
      chainSpec_v1_chainName,
      chainSpec_v1_genesisHash,
      chainSpec_v1_properties,
      system_name,
      system_chainType,
      system_version,
      system_properties,
    ]
  servers:
    - name: subway
      url: ws://localhost:9945
      presets: polkadot_legacy
    #- name: chaos
    #  url: ws://localhost:9944
    #  request_timeout: 5s
    #  connection_timeout: 10s
    #  max_connections: 100
    #  retry_delay: 1s
    - name: stakeworld
      url: wss://dot-rpc.stakeworld.io
      presets: polkadot_v1
      methods:
        chainHead_v1_follow:
          max_subscribers: 4
    - name: helix
      url: wss://rpc-polkadot.helixstreet.io
      presets: polkadot_v1
      methods:
        chainHead_v1_follow:
          max_subscribers: 4
json_rpc:
  max_pending_requests_per_connection: 50
  max_pending_requests: 500
  max_requests_per_second: 20
