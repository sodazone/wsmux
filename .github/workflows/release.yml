name: Release
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual release (e.g. v1.2.3)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Set version
        run: echo "VERSION=${{ github.event.inputs.tag_name || github.ref_name }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test
      - name: Build
        run: bun dist
      - name: Rename executable with version
        run: mv dist/wsmux-x64-modern dist/wsmux-x64-modern-$VERSION
      - name: Compress executable
        run: gzip dist/wsmux-x64-modern-$VERSION
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/wsmux-x64-modern-${{ env.VERSION }}.gz
