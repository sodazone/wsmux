name: Release
permissions:
  contents: write
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test
      - name: Build
        run: bun dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wsmux-x64-modern
